<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/20-minutes@main/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unity Web Player | 20 Minutes Till Dawn</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      body { background: #231F20; }

      #loading-text {
        font-weight: bold;
        color: white;
        font-size: 36px;
        font-family: cursive;
        text-align: center;
        margin-top: 20px;
        background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff);
        background-size: 400% 400%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rainbow 3s ease infinite;
      }
      @keyframes rainbow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      #status-panel {
        display: none;
        max-width: 640px;
        margin: 24px auto;
        padding: 16px 20px;
        border-radius: 8px;
        background: #3a3436;
        color: #eee;
        font-family: sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }
      #status-panel.error { border-left: 5px solid #e5484d; }
      #status-panel.warn  { border-left: 5px solid #f5a524; }
      #status-panel ul { margin: 8px 0 12px 20px; padding: 0; }
      #status-panel button, #fs-button {
        font-size: 14px;
        padding: 8px 14px;
        margin: 4px 8px 0 0;
        border: 0;
        border-radius: 6px;
        background: #6e56cf;
        color: #fff;
        cursor: pointer;
      }
      #status-panel button.secondary { background: #555; }
      #fs-button { display: none; position: fixed; right: 12px; bottom: 12px; opacity: .85; }
    </style>
  </head>
  <body>
    <div id="loading-text">LOADING...</div>
    <div id="status-panel"></div>

    <div id="unity-container">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <button id="fs-button" type="button">Fullscreen</button>

    <script>
(function () {
  "use strict";

  /* ---------------- Config ---------------- */
  var CACHE_NAME   = "20mins-cache-v2";
  var STATE_KEY    = "20mins-load-state";
  var MAX_CRASHES  = 2;          // after this many crashed loads, stop and show help
  var MAX_RETRIES  = 3;          // per-part download retries
  // Approximate total download size (bytes), used only for the progress display.
  var EXPECTED_TOTAL = 57650104;

  var FILES = [
    { name: "20minutes.data", parts: ["Build/20minutes.data.part1", "Build/20minutes.data.part2"], mime: "application/octet-stream" },
    { name: "20minutes.wasm", parts: ["Build/20minutes.wasm.part1", "Build/20minutes.wasm.part2"], mime: "application/wasm" }
  ];

  /* ---------------- Elements ---------------- */
  var loadingText = document.getElementById("loading-text");
  var panel       = document.getElementById("status-panel");
  var container   = document.getElementById("unity-container");
  var canvas      = document.getElementById("unity-canvas");
  var loadingBar  = document.getElementById("unity-loading-bar");
  var progressBar = document.getElementById("unity-progress-bar-full");
  var warningBox  = document.getElementById("unity-warning");
  var fsButton    = document.getElementById("fs-button");

  var loadedBytes = 0;
  var unityInstance = null;

  /* ---------------- Small helpers ---------------- */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function readState() {
    try { return JSON.parse(sessionStorage.getItem(STATE_KEY) || "{}"); } catch (e) { return {}; }
  }
  function writeState(s) {
    try { sessionStorage.setItem(STATE_KEY, JSON.stringify(s)); } catch (e) {}
  }

  function showPanel(kind, html) {
    panel.className = kind;
    panel.innerHTML = html;
    panel.style.display = "block";
  }
  function hidePanel() { panel.style.display = "none"; panel.innerHTML = ""; }

  function updateProgressText() {
    var mb = (loadedBytes / 1048576).toFixed(1);
    var total = (EXPECTED_TOTAL / 1048576).toFixed(1);
    var pct = Math.min(99, Math.floor((loadedBytes / EXPECTED_TOTAL) * 100));
    loadingText.textContent = "LOADING... " + mb + " MB / ~" + total + " MB (" + pct + "%)";
  }

  /* ---------------- Download one part into a Blob ----------------
     Each part becomes its own Blob right away, so we never hold a second
     full-size copy of the bytes in JS memory (the old code did). */
  async function downloadPart(url) {
    var lastErr;
    for (var attempt = 1; attempt <= MAX_RETRIES; attempt++) {
      var before = loadedBytes;
      try {
        var res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
        var reader = res.body.getReader();
        var chunks = [];
        for (;;) {
          var r = await reader.read();
          if (r.done) break;
          chunks.push(r.value);
          loadedBytes += r.value.length;
          updateProgressText();
        }
        var blob = new Blob(chunks);
        chunks = null; // let the GC drop the raw chunks
        return blob;
      } catch (e) {
        lastErr = e;
        loadedBytes = before; // roll back progress for the failed attempt
        updateProgressText();
        if (attempt < MAX_RETRIES) await sleep(800 * attempt);
      }
    }
    throw lastErr;
  }

  /* ---------------- Cache (safe, optional) ---------------- */
  async function openCache() {
    try { return ("caches" in window) ? await caches.open(CACHE_NAME) : null; }
    catch (e) { return null; }
  }

  async function clearCaches() {
    try {
      if ("caches" in window) {
        var keys = await caches.keys();
        await Promise.all(keys.filter(function (k) { return k.indexOf("20mins") === 0; })
                              .map(function (k) { return caches.delete(k); }));
      }
    } catch (e) {}
  }

  /* ---------------- Get one merged file as a blob: URL ---------------- */
  async function getFileUrl(file) {
    var cache = await openCache();

    if (cache) {
      try {
        var hit = await cache.match(file.name);
        if (hit && hit.ok) {
          var cachedBlob = await hit.blob();
          if (cachedBlob.size > 0) {
            loadedBytes += cachedBlob.size;
            updateProgressText();
            return URL.createObjectURL(new Blob([cachedBlob], { type: file.mime }));
          }
        }
        // empty or bad entry: remove it and re-download
        await cache.delete(file.name);
      } catch (e) {
        try { await cache.delete(file.name); } catch (e2) {}
      }
    }

    // Download parts ONE AT A TIME (parallel downloads multiply peak memory).
    var blobs = [];
    for (var i = 0; i < file.parts.length; i++) {
      blobs.push(await downloadPart(file.parts[i]));
    }
    // Blob-of-blobs does not copy the bytes. The MIME type matters: with
    // application/wasm the browser can stream-compile the module.
    var merged = new Blob(blobs, { type: file.mime });
    blobs = null;

    if (cache) {
      try {
        await cache.put(file.name, new Response(merged, { headers: { "Content-Type": file.mime } }));
      } catch (e) {
        // Quota or storage errors must never stop the game from loading.
        console.warn("Could not cache " + file.name + ":", e);
      }
    }
    return URL.createObjectURL(merged);
  }

  /* ---------------- Unity banner (errors/warnings in the page) ---------------- */
  function unityShowBanner(msg, type) {
    function refresh() {
      var nodes = warningBox.children;
      for (var i = 0; i < nodes.length; i++) nodes[i].style.display = "block";
      warningBox.style.display = nodes.length ? "block" : "none";
    }
    var div = document.createElement("div");
    div.textContent = msg;
    warningBox.appendChild(div);
    if (type === "error") {
      div.style.background = "red"; div.style.padding = "10px";
      console.error(msg);
    } else if (type === "warning") {
      div.style.background = "yellow"; div.style.color = "#000"; div.style.padding = "10px";
      setTimeout(function () { if (div.parentNode) warningBox.removeChild(div); refresh(); }, 5000);
    }
    refresh();
  }

  /* ---------------- Start the game ---------------- */
  async function start() {
    hidePanel();
    loadingText.style.display = "";
    loadedBytes = 0;
    updateProgressText();

    var state = readState();
    writeState({ loading: true, crashes: state.crashes || 0 });

    var urls = {};
    try {
      // Sequential on purpose: lower peak memory than Promise.all.
      for (var i = 0; i < FILES.length; i++) {
        urls[FILES[i].name] = await getFileUrl(FILES[i]);
      }
    } catch (e) {
      console.error(e);
      writeState({ loading: false, crashes: 0 });
      loadingText.style.display = "none";
      showPanel("error",
        "<b>Download failed.</b><br>" + String(e && e.message || e) +
        "<br><br><button id='retry'>Try again</button>");
      document.getElementById("retry").onclick = start;
      return;
    }

    loadingText.textContent = "STARTING GAME...";
    loadingBar.style.display = "block";

    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: urls["20minutes.data"],
      frameworkUrl: buildUrl + "/20minutes.framework.js",
      codeUrl: urls["20minutes.wasm"],
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Flanne",
      productName: "MinutesTillDawn",
      productVersion: "0.6.6",
      showBanner: unityShowBanner
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.head.appendChild(meta);
    }

    var script = document.createElement("script");
    script.src = buildUrl + "/20minutes.loader.js";
    script.onerror = function () {
      writeState({ loading: false, crashes: 0 });
      showPanel("error", "<b>Could not load the Unity loader script.</b><br>Check your connection and reload.");
    };
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBar.style.width = (100 * progress) + "%";
      }).then(function (instance) {
        unityInstance = instance;
        loadingBar.style.display = "none";
        loadingText.remove();
        writeState({ loading: false, crashes: 0 }); // success: reset crash counter
        fsButton.style.display = "block";
        // Unity has copied the files into its own memory; free our blob copies.
        for (var k in urls) { try { URL.revokeObjectURL(urls[k]); } catch (e) {} }
      }).catch(function (message) {
        writeState({ loading: false, crashes: 0 });
        loadingText.style.display = "none";
        showPanel("error", "<b>The game failed to start.</b><br>" + String(message) +
          "<br><br><button id='retry'>Try again</button>");
        document.getElementById("retry").onclick = function () { location.reload(); };
      });
    };
    document.body.appendChild(script);
  }

  /* ---------------- Fullscreen: only when the user clicks ---------------- */
  fsButton.addEventListener("click", function () {
    if (unityInstance) unityInstance.SetFullscreen(1);
  });

  /* A normal reload/close fires pagehide. A tab crash does not, so a leftover
     "loading: true" flag on startup means the previous attempt crashed. */
  window.addEventListener("pagehide", function () {
    var s = readState();
    if (s.loading) writeState({ loading: false, crashes: s.crashes || 0 });
  });

  /* ---------------- Crash-loop guard ---------------- */
  var prev = readState();
  var crashes = prev.loading ? (prev.crashes || 0) + 1 : (prev.crashes || 0);

  if (prev.loading) writeState({ loading: false, crashes: crashes });

  if (crashes >= MAX_CRASHES) {
    loadingText.style.display = "none";
    showPanel("warn",
      "<b>This tab crashed " + crashes + " times while loading.</b><br>" +
      "It most likely ran out of memory. Before trying again:" +
      "<ul>" +
      "<li>Close other tabs and heavy apps</li>" +
      "<li>Restart your browser</li>" +
      "<li>Try a different browser (Firefox or Edge)</li>" +
      "</ul>" +
      "<button id='go'>Try loading anyway</button>" +
      "<button id='clr' class='secondary'>Clear cached game files</button>");
    document.getElementById("go").onclick = function () {
      writeState({ loading: false, crashes: 0 });
      start();
    };
    document.getElementById("clr").onclick = async function () {
      await clearCaches();
      this.textContent = "Cache cleared";
    };
  } else {
    start();
  }
})();
    </script>
  </body>
</html>
