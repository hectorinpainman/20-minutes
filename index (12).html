<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/20-minutes@main/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unity Web Player | 20 Minutes Till Dawn</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      body { background: #231F20; }

      #loading-text {
        font-weight: bold;
        color: white;
        font-size: 36px;
        font-family: cursive;
        text-align: center;
        margin-top: 20px;
        background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff);
        background-size: 400% 400%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rainbow 3s ease infinite;
      }
      @keyframes rainbow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      #status-panel {
        display: none;
        max-width: 640px;
        margin: 24px auto;
        padding: 16px 20px;
        border-radius: 8px;
        background: #3a3436;
        color: #eee;
        font-family: sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }
      #status-panel.error { border-left: 5px solid #e5484d; }
      #status-panel.warn  { border-left: 5px solid #f5a524; }
      #status-panel ul { margin: 8px 0 12px 20px; padding: 0; }
      #status-panel button, #fs-button {
        font-size: 14px;
        padding: 8px 14px;
        margin: 4px 8px 0 0;
        border: 0;
        border-radius: 6px;
        background: #6e56cf;
        color: #fff;
        cursor: pointer;
      }
      #status-panel button.secondary { background: #555; }
      #fs-button { display: none; position: fixed; right: 12px; bottom: 12px; opacity: .85; }

      /* ---- Debug terminal ---- */
      #dbg {
        display: none;
        position: fixed; left: 0; right: 0; bottom: 0;
        height: 44vh; min-height: 180px;
        flex-direction: column;
        z-index: 9999;
        background: rgba(10, 10, 14, .95);
        color: #d6d6d6;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        border-top: 2px solid #6e56cf;
      }
      #dbg-bar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 4px 8px; background: #1b1b24; color: #aaa; user-select: none;
      }
      #dbg-bar button, #dbg-toggle {
        font: inherit; color: #fff; background: #3b3b4a; border: 0; border-radius: 4px;
        padding: 3px 9px; margin-left: 5px; cursor: pointer;
      }
      #dbg-bar button:hover, #dbg-toggle:hover { background: #6e56cf; }
      #dbg-out { flex: 1; overflow-y: auto; padding: 6px 8px; }
      .dl { white-space: pre-wrap; word-break: break-word; }
      .dl.warn  { color: #f5a524; }
      .dl.error { color: #ff6369; }
      .dl.cmd   { color: #6ee7a0; }
      .dl.out   { color: #9ad1ff; }
      .dl.mem   { color: #7f8aa3; }
      .dl.prev  { opacity: .7; font-style: italic; }
      #dbg-in { display: flex; align-items: center; padding: 4px 8px; background: #14141b; }
      #dbg-in span { color: #6ee7a0; margin-right: 6px; }
      #dbg-input {
        flex: 1; background: transparent; border: 0; outline: 0;
        color: #fff; font: inherit;
      }
      #dbg-toggle {
        position: fixed; left: 12px; bottom: 12px; z-index: 9998;
        opacity: .75; margin: 0; padding: 6px 12px; font-size: 13px;
      }
      #dbg-badge {
        display: none; background: #e5484d; color: #fff; border-radius: 9px;
        padding: 0 6px; margin-left: 4px; font-size: 11px;
      }
      #fs-button { z-index: 100; }
    </style>
  </head>
  <body>
    <div id="loading-text">LOADING...</div>
    <div id="status-panel"></div>

    <div id="unity-container">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <button id="fs-button" type="button">Fullscreen</button>

    <div id="dbg">
      <div id="dbg-bar">
        <span>Debug terminal &mdash; F2 to toggle &mdash; type <b>help</b></span>
        <span>
          <button type="button" data-c="mem">mem</button>
          <button type="button" data-c="info">info</button>
          <button type="button" data-c="copy">copy</button>
          <button type="button" data-c="save">save</button>
          <button type="button" data-c="clear">clear</button>
          <button type="button" id="dbg-close">&times;</button>
        </span>
      </div>
      <div id="dbg-out"></div>
      <div id="dbg-in">
        <span>&gt;</span>
        <input id="dbg-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="command...">
      </div>
    </div>
    <button id="dbg-toggle" type="button">Debug<span id="dbg-badge"></span></button>

    <script>
/* =====================  DEBUG TERMINAL  =====================
   Loaded BEFORE the game script so it captures everything.
   Open: F2 (or the Debug button, or add ?debug to the URL).
   The log is kept in sessionStorage, so after a tab crash + auto-reload you
   can type  prev  to read what happened right before the crash. */
(function () {
  "use strict";

  var LOG_KEY = "20mins-debug-log", PREV_KEY = "20mins-debug-prev", STATE_KEY = "20mins-load-state";
  var MAX_LINES = 800, PERSIST_LINES = 150, MAX_LEN = 3000;

  function $(id) { return document.getElementById(id); }
  var panel = $("dbg"), out = $("dbg-out"), input = $("dbg-input"),
      toggle = $("dbg-toggle"), badge = $("dbg-badge");

  var lines = [], prevLog = [], errCount = 0;
  var lastRec = null, lastEl = null;
  var persistTimer = null, watchTimer = null;
  var history = [], histIdx = 0;
  var t0 = performance.now();

  function mb(b) { return (b / 1048576).toFixed(1) + " MB"; }

  function fmt(a) {
    if (typeof a === "string") return a;
    if (a instanceof Error) return a.stack || a.message || String(a);
    if (a === undefined) return "undefined";
    try {
      var seen = [];
      return JSON.stringify(a, function (k, v) {
        if (typeof v === "function") return "[function]";
        if (typeof v === "object" && v !== null) {
          if (seen.indexOf(v) > -1) return "[circular]";
          seen.push(v);
        }
        return v;
      }, 1);
    } catch (e) { return String(a); }
  }

  /* ---- previous session log (survives a tab crash + reload) ---- */
  try {
    var cur = JSON.parse(sessionStorage.getItem(LOG_KEY) || "[]");
    if (cur.length > 12) {
      prevLog = cur;
      sessionStorage.setItem(PREV_KEY, JSON.stringify(cur));
    } else {
      prevLog = JSON.parse(sessionStorage.getItem(PREV_KEY) || "[]");
    }
  } catch (e) {}

  function persist() {
    persistTimer = null;
    try { sessionStorage.setItem(LOG_KEY, JSON.stringify(lines.slice(-PERSIST_LINES))); } catch (e) {}
  }
  function schedulePersist(now) {
    if (now) { clearTimeout(persistTimer); persist(); }
    else if (!persistTimer) persistTimer = setTimeout(persist, 300);
  }

  /* ---- rendering ---- */
  function label(rec) {
    return "[" + rec.t + "] " + rec.m + (rec.n > 1 ? "  (x" + rec.n + ")" : "");
  }
  function render(rec, cls) {
    var atBottom = out.scrollTop + out.clientHeight >= out.scrollHeight - 20;
    var d = document.createElement("div");
    d.className = "dl " + (cls || rec.l);
    d.textContent = label(rec);
    out.appendChild(d);
    while (out.childNodes.length > MAX_LINES) out.removeChild(out.firstChild);
    if (atBottom) out.scrollTop = out.scrollHeight;
    return d;
  }

  function addLine(level, text, cls) {
    text = String(text).replace(/\s+$/, "");
    if (!text) return;
    if (text.length > MAX_LEN) text = text.slice(0, MAX_LEN) + "... [truncated]";
    if (lastRec && !cls && lastRec.l === level && lastRec.m === text) {
      lastRec.n = (lastRec.n || 1) + 1;          // identical to the previous line: just count it
      if (lastEl) lastEl.textContent = label(lastRec);
      schedulePersist(false);
      return;
    }
    var rec = { t: ((performance.now() - t0) / 1000).toFixed(2), l: level, m: text, n: 1 };
    lines.push(rec);
    if (lines.length > MAX_LINES) lines.shift();
    lastRec = rec;
    lastEl = render(rec, cls);
    if (level === "error") {
      errCount++;
      if (panel.style.display !== "flex") {
        badge.textContent = errCount;
        badge.style.display = "inline-block";
      }
      schedulePersist(true);
    } else {
      schedulePersist(false);
    }
  }

  /* ---- capture console.* ---- */
  ["log", "info", "warn", "error", "debug"].forEach(function (k) {
    var orig = console[k];
    console[k] = function () {
      try { addLine(k === "debug" ? "info" : k, Array.prototype.map.call(arguments, fmt).join(" ")); } catch (e) {}
      return orig.apply(console, arguments);
    };
  });

  /* ---- capture uncaught errors, failed resources, rejections ---- */
  window.addEventListener("error", function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href)) {
      addLine("error", "Resource failed to load: " + (t.src || t.href));
      return;
    }
    addLine("error", "Uncaught: " + (e.message || "") +
      (e.filename ? " (" + e.filename + ":" + e.lineno + ":" + e.colno + ")" : "") +
      (e.error && e.error.stack ? "\n" + e.error.stack : ""));
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    addLine("error", "Unhandled promise rejection: " + fmt(e.reason));
  });
  window.addEventListener("pagehide", function () { addLine("info", "[page] pagehide"); schedulePersist(true); });
  document.addEventListener("visibilitychange", function () { addLine("info", "[page] visibility: " + document.visibilityState); });
  window.addEventListener("online",  function () { addLine("info", "[net] online"); });
  window.addEventListener("offline", function () { addLine("warn", "[net] offline"); });
  var cv = $("unity-canvas");
  if (cv) {
    cv.addEventListener("webglcontextlost", function () { addLine("error", "[webgl] CONTEXT LOST (GPU reset or out of GPU memory)"); });
    cv.addEventListener("webglcontextrestored", function () { addLine("warn", "[webgl] context restored"); });
  }

  /* ---- diagnostics ---- */
  function memLine() {
    var p = [], pm = performance.memory, g = window.__game, inst;
    if (pm) p.push("JS heap " + mb(pm.usedJSHeapSize) + " / " + mb(pm.totalJSHeapSize) + " (limit " + mb(pm.jsHeapSizeLimit) + ")");
    try {
      inst = g && g.getInstance();
      if (inst && inst.Module && inst.Module.HEAPU8) p.push("Unity heap " + mb(inst.Module.HEAPU8.length));
    } catch (e) {}
    if (g) p.push("game files loaded " + mb(g.getLoaded()) + " (cache or network, not re-downloading)");
    if (navigator.deviceMemory) p.push("device RAM >= " + navigator.deviceMemory + " GB");
    return p.length ? p.join(" | ") : "No memory info available in this browser";
  }

  function gpuInfo() {
    var c = document.createElement("canvas");
    var gl = c.getContext("webgl2") || c.getContext("webgl");
    if (!gl) return "WebGL unavailable";
    var ext = gl.getExtension("WEBGL_debug_renderer_info");
    var r = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    var v = ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
    var ver = gl.getParameter(gl.VERSION);
    var lose = gl.getExtension("WEBGL_lose_context");
    if (lose) lose.loseContext();
    return v + " / " + r + " (" + ver + ")";
  }

  function allText() {
    return lines.map(function (r) { return "[" + r.t + "] " + r.l.toUpperCase() + " " + r.m + (r.n > 1 ? "  (x" + r.n + ")" : ""); }).join("\n");
  }

  function startWatch(sec) {
    stopWatch();
    watchTimer = setInterval(function () { addLine("mem", "[mem] " + memLine()); }, sec * 1000);
  }
  function stopWatch() { if (watchTimer) { clearInterval(watchTimer); watchTimer = null; } }

  /* ---- commands ---- */
  var commands = {
    help: { d: "list commands", run: function () {
      return Object.keys(commands).map(function (k) {
        return "  " + (k + "           ").slice(0, 11) + commands[k].d;
      }).join("\n");
    } },
    clear: { d: "clear the screen", run: function () { out.textContent = ""; lines = []; lastRec = lastEl = null; schedulePersist(true); } },
    info: { d: "browser, GPU, screen, memory capabilities", run: function () {
      var conn = navigator.connection || {};
      return [
        "Browser:   " + navigator.userAgent,
        "Screen:    " + screen.width + "x" + screen.height + " @" + (window.devicePixelRatio || 1) + "x",
        "CPU:       " + (navigator.hardwareConcurrency || "?") + " threads",
        "Device RAM:" + (navigator.deviceMemory ? " >= " + navigator.deviceMemory + " GB (browser caps this at 8)" : " unknown"),
        "GPU:       " + gpuInfo(),
        "Network:   " + (navigator.onLine ? "online" : "OFFLINE") + (conn.effectiveType ? " (" + conn.effectiveType + ")" : ""),
        "Secure:    " + window.isSecureContext + ", SharedArrayBuffer: " + (typeof SharedArrayBuffer !== "undefined"),
        "Cache API: " + ("caches" in window)
      ].join("\n");
    } },
    mem: { d: "current memory usage", run: function () { return memLine(); } },
    watch: { d: "watch [off|seconds] - periodic memory log (default on, 5s)", run: function (a) {
      if (a === "off") { stopWatch(); return "memory watch off"; }
      var n = parseFloat(a) || 5; startWatch(n); return "memory watch every " + n + "s";
    } },
    cache: { d: "list cached game files", run: async function () {
      if (!("caches" in window)) return "Cache Storage unavailable";
      var keys = await caches.keys(), res = [];
      for (var i = 0; i < keys.length; i++) {
        var c = await caches.open(keys[i]), reqs = await c.keys();
        for (var j = 0; j < reqs.length; j++) {
          var r = await c.match(reqs[j]), b = await r.blob();
          res.push(keys[i] + " / " + decodeURIComponent(reqs[j].url.split("/").pop()) + " = " + mb(b.size));
        }
      }
      var est = "";
      try { var e = await navigator.storage.estimate(); est = "\nStorage used " + mb(e.usage) + " of " + mb(e.quota); } catch (x) {}
      return (res.length ? res.join("\n") : "No cached files") + est;
    } },
    clearcache: { d: "delete cached game files", run: async function () {
      if (!("caches" in window)) return "Cache Storage unavailable";
      var keys = await caches.keys();
      await Promise.all(keys.filter(function (k) { return k.indexOf("20mins") === 0; })
                            .map(function (k) { return caches.delete(k); }));
      return "Deleted " + keys.length + " cache(s). Reload to re-download.";
    } },
    net: { d: "download timings for game files", run: function () {
      var r = performance.getEntriesByType("resource").filter(function (e) { return /Build|\.part\d|loader|framework/.test(e.name); });
      if (!r.length) return "No resource timings yet";
      return r.map(function (e) {
        return e.name.split("/").slice(-2).join("/") + "  " + (e.duration / 1000).toFixed(1) + "s  " +
               (e.transferSize ? mb(e.transferSize) : "size n/a");
      }).join("\n");
    } },
    fps: { d: "measure frame rate for 2 seconds", run: function () {
      return new Promise(function (res) {
        var n = 0, s = performance.now();
        (function f() {
          n++;
          if (performance.now() - s < 2000) requestAnimationFrame(f);
          else res((n / ((performance.now() - s) / 1000)).toFixed(1) + " fps");
        })();
      });
    } },
    state: { d: "crash-guard state", run: function () {
      var g = window.__game;
      return g ? fmt(g.readState()) : "game script not ready";
    } },
    resetcrash: { d: "reset the crash counter", run: function () {
      var g = window.__game;
      if (g) g.writeState({ loading: false, crashes: 0 });
      else try { sessionStorage.removeItem(STATE_KEY); } catch (e) {}
      return "crash counter reset";
    } },
    prev: { d: "prev [n] - log from the previous page session (after a crash)", run: function (a) {
      var n = parseInt(a, 10) || 40;
      if (!prevLog.length) return "No previous-session log.";
      var slice = prevLog.slice(-n);
      slice.forEach(function (r) { render(r, "prev " + r.l); });
      lastRec = lastEl = null;
      return "--- end of previous session (" + slice.length + " of " + prevLog.length + " lines) ---";
    } },
    copy: { d: "copy the log to the clipboard", run: function () {
      var text = allText();
      function fallback() {
        var ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
        return "Copied " + lines.length + " lines";
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).then(function () { return "Copied " + lines.length + " lines"; }, fallback);
      }
      return fallback();
    } },
    save: { d: "download the log as a .txt file", run: function () {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([allText()], { type: "text/plain" }));
      a.download = "20mins-debug-" + new Date().toISOString().replace(/[:.]/g, "-") + ".txt";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      return "Saved " + a.download;
    } },
    js: { d: "js <code> - run JavaScript in the page", run: function (a) {
      if (!a) return "usage: js <code>";
      return Promise.resolve((0, eval)(a)).then(fmt);
    } },
    fs: { d: "enter fullscreen", run: function () {
      var g = window.__game, i = g && g.getInstance();
      if (!i) return "game not running yet";
      i.SetFullscreen(1); return "fullscreen requested";
    } },
    reload: { d: "reload [hard] - hard also clears the cache", run: async function (a) {
      if (a === "hard") await commands.clearcache.run();
      location.reload();
      return "reloading...";
    } },
    close: { d: "close the terminal", run: function () { close(); } }
  };

  function run(raw) {
    raw = (raw || "").trim();
    if (!raw) return;
    addLine("cmd", "> " + raw);
    var sp = raw.indexOf(" ");
    var name = (sp < 0 ? raw : raw.slice(0, sp)).toLowerCase();
    var args = sp < 0 ? "" : raw.slice(sp + 1).trim();
    var c = commands[name];
    if (!c) { addLine("warn", 'Unknown command "' + name + '". Type help.'); return; }
    try {
      Promise.resolve(c.run(args)).then(function (v) {
        if (v !== undefined && v !== "") addLine("out", v);
      }, function (e) { addLine("error", "Command failed: " + fmt(e)); });
    } catch (e) { addLine("error", "Command failed: " + fmt(e)); }
  }

  /* ---- open / close ---- */
  function isOpen() { return panel.style.display === "flex"; }
  function open() {
    panel.style.display = "flex";
    toggle.style.display = "none";
    errCount = 0; badge.textContent = ""; badge.style.display = "none";
    out.scrollTop = out.scrollHeight;
    setTimeout(function () { input.focus(); }, 0);
  }
  function close() {
    panel.style.display = "none";
    toggle.style.display = "";
    input.blur();
  }

  toggle.addEventListener("click", open);
  $("dbg-close").addEventListener("click", close);
  Array.prototype.forEach.call(panel.querySelectorAll("button[data-c]"), function (b) {
    b.addEventListener("click", function () { run(b.getAttribute("data-c")); });
  });

  /* F2 (or the Backquote key) toggles. Spanish keyboards make ` a dead key, so F2 is the main one. */
  document.addEventListener("keydown", function (e) {
    var tag = e.target && e.target.tagName;
    var typingElsewhere = (tag === "INPUT" || tag === "TEXTAREA") && e.target !== input;
    if ((e.key === "F2" || e.code === "Backquote") && !typingElsewhere) {
      e.preventDefault(); e.stopPropagation();
      if (isOpen()) close(); else open();
    }
  }, true);

  /* keep game controls from reacting to typing in the terminal */
  ["keyup", "keypress"].forEach(function (ev) {
    input.addEventListener(ev, function (e) { e.stopPropagation(); });
  });
  input.addEventListener("keydown", function (e) {
    e.stopPropagation();
    if (e.key === "Enter") {
      var v = input.value; input.value = "";
      if (v.trim()) history.push(v);
      histIdx = history.length;
      run(v);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (histIdx > 0) { histIdx--; input.value = history[histIdx]; }
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; }
      else { histIdx = history.length; input.value = ""; }
    } else if (e.key === "Tab") {
      e.preventDefault();
      var p = input.value.toLowerCase();
      if (p) {
        var m = Object.keys(commands).filter(function (k) { return k.indexOf(p) === 0; });
        if (m.length === 1) input.value = m[0] + " ";
        else if (m.length > 1) addLine("out", m.join("  "));
      }
    } else if (e.key === "Escape") {
      close();
    }
  });

  /* ---- startup messages ---- */
  addLine("info", "Debug terminal ready. F2 toggles it. Type \"help\" for commands.");
  addLine("info", "UA: " + navigator.userAgent);
  addLine("info", "Memory: " + memLine());
  try {
    var st = JSON.parse(sessionStorage.getItem(STATE_KEY) || "{}");
    if (st.loading) addLine("warn", "The previous load did NOT finish cleanly (likely a tab crash). Type \"prev\" to see its last log lines.");
    else if (prevLog.length) addLine("info", "Log from the previous page session is available: type \"prev\".");
  } catch (e) {}

  startWatch(5);

  window.dbg = {
    open: open, close: close, toggle: function () { isOpen() ? close() : open(); },
    log: function (m, level) { addLine(level || "info", m); },
    run: run
  };

  if (/[?&]debug\b/.test(location.search)) open();
})();
    </script>

    <script>
(function () {
  "use strict";

  /* ---------------- Config ---------------- */
  var CACHE_NAME   = "20mins-cache-v2";
  var STATE_KEY    = "20mins-load-state";
  var MAX_CRASHES  = 2;          // after this many crashed loads, stop and show help
  var MAX_RETRIES  = 3;          // per-part download retries
  // Approximate total download size (bytes), used only for the progress display.
  var EXPECTED_TOTAL = 57650104;

  var FILES = [
    { name: "20minutes.data", parts: ["Build/20minutes.data.part1", "Build/20minutes.data.part2"], mime: "application/octet-stream" },
    { name: "20minutes.wasm", parts: ["Build/20minutes.wasm.part1", "Build/20minutes.wasm.part2"], mime: "application/wasm" }
  ];

  /* ---------------- Elements ---------------- */
  var loadingText = document.getElementById("loading-text");
  var panel       = document.getElementById("status-panel");
  var container   = document.getElementById("unity-container");
  var canvas      = document.getElementById("unity-canvas");
  var loadingBar  = document.getElementById("unity-loading-bar");
  var progressBar = document.getElementById("unity-progress-bar-full");
  var warningBox  = document.getElementById("unity-warning");
  var fsButton    = document.getElementById("fs-button");

  var loadedBytes = 0;
  var unityInstance = null;
  var stableTimer = null;

  /* ---------------- Small helpers ---------------- */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function readState() {
    try { return JSON.parse(sessionStorage.getItem(STATE_KEY) || "{}"); } catch (e) { return {}; }
  }
  function writeState(s) {
    try { sessionStorage.setItem(STATE_KEY, JSON.stringify(s)); } catch (e) {}
  }

  function showPanel(kind, html) {
    panel.className = kind;
    panel.innerHTML = html;
    panel.style.display = "block";
  }
  function hidePanel() { panel.style.display = "none"; panel.innerHTML = ""; }

  function updateProgressText() {
    var mb = (loadedBytes / 1048576).toFixed(1);
    var total = (EXPECTED_TOTAL / 1048576).toFixed(1);
    var pct = Math.min(99, Math.floor((loadedBytes / EXPECTED_TOTAL) * 100));
    loadingText.textContent = "LOADING... " + mb + " MB / ~" + total + " MB (" + pct + "%)";
  }

  /* ---------------- Download one part into a Blob ----------------
     Each part becomes its own Blob right away, so we never hold a second
     full-size copy of the bytes in JS memory (the old code did). */
  async function downloadPart(url) {
    var lastErr;
    for (var attempt = 1; attempt <= MAX_RETRIES; attempt++) {
      var before = loadedBytes;
      try {
        var res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
        var reader = res.body.getReader();
        var chunks = [];
        for (;;) {
          var r = await reader.read();
          if (r.done) break;
          chunks.push(r.value);
          loadedBytes += r.value.length;
          updateProgressText();
        }
        var blob = new Blob(chunks);
        console.log("[download] " + url + " OK (" + (blob.size / 1048576).toFixed(1) + " MB, attempt " + attempt + ")");
        chunks = null; // let the GC drop the raw chunks
        return blob;
      } catch (e) {
        lastErr = e;
        console.warn("[download] " + url + " failed (attempt " + attempt + "/" + MAX_RETRIES + "): " + (e && e.message || e));
        loadedBytes = before; // roll back progress for the failed attempt
        updateProgressText();
        if (attempt < MAX_RETRIES) await sleep(800 * attempt);
      }
    }
    throw lastErr;
  }

  /* ---------------- Cache (safe, optional) ---------------- */
  async function openCache() {
    try { return ("caches" in window) ? await caches.open(CACHE_NAME) : null; }
    catch (e) { return null; }
  }

  async function clearCaches() {
    try {
      if ("caches" in window) {
        var keys = await caches.keys();
        await Promise.all(keys.filter(function (k) { return k.indexOf("20mins") === 0; })
                              .map(function (k) { return caches.delete(k); }));
      }
    } catch (e) {}
  }

  /* ---------------- Get one merged file as a blob: URL ---------------- */
  async function getFileUrl(file) {
    var cache = await openCache();

    if (cache) {
      try {
        var hit = await cache.match(file.name);
        if (hit && hit.ok) {
          var cachedBlob = await hit.blob();
          if (cachedBlob.size > 0) {
            console.log("[cache] hit: " + file.name + " (" + (cachedBlob.size / 1048576).toFixed(1) + " MB)");
            loadedBytes += cachedBlob.size;
            updateProgressText();
            return URL.createObjectURL(new Blob([cachedBlob], { type: file.mime }));
          }
        }
        // empty or bad entry: remove it and re-download
        await cache.delete(file.name);
      } catch (e) {
        try { await cache.delete(file.name); } catch (e2) {}
      }
    }

    console.log("[cache] miss: downloading " + file.name);
    // Download parts ONE AT A TIME (parallel downloads multiply peak memory).
    var blobs = [];
    for (var i = 0; i < file.parts.length; i++) {
      blobs.push(await downloadPart(file.parts[i]));
    }
    // Blob-of-blobs does not copy the bytes. The MIME type matters: with
    // application/wasm the browser can stream-compile the module.
    var merged = new Blob(blobs, { type: file.mime });
    blobs = null;

    if (cache) {
      try {
        await cache.put(file.name, new Response(merged, { headers: { "Content-Type": file.mime } }));
      } catch (e) {
        // Quota or storage errors must never stop the game from loading.
        console.warn("Could not cache " + file.name + ":", e);
      }
      console.log("[cache] stored: " + file.name);
    }
    return URL.createObjectURL(merged);
  }

  /* ---------------- Unity banner (errors/warnings in the page) ---------------- */
  function unityShowBanner(msg, type) {
    function refresh() {
      var nodes = warningBox.children;
      for (var i = 0; i < nodes.length; i++) nodes[i].style.display = "block";
      warningBox.style.display = nodes.length ? "block" : "none";
    }
    var div = document.createElement("div");
    div.textContent = msg;
    warningBox.appendChild(div);
    if (type === "error") {
      div.style.background = "red"; div.style.padding = "10px";
      console.error(msg);
    } else if (type === "warning") {
      div.style.background = "yellow"; div.style.color = "#000"; div.style.padding = "10px";
      setTimeout(function () { if (div.parentNode) warningBox.removeChild(div); refresh(); }, 5000);
    }
    refresh();
  }

  /* ---------------- Start the game ---------------- */
  async function start() {
    hidePanel();
    loadingText.style.display = "";
    loadedBytes = 0;
    updateProgressText();

    var state = readState();
    writeState({ loading: true, crashes: state.crashes || 0 });
    console.log("[start] beginning load (crash count so far: " + (state.crashes || 0) + ")");

    var urls = {};
    try {
      // Sequential on purpose: lower peak memory than Promise.all.
      for (var i = 0; i < FILES.length; i++) {
        urls[FILES[i].name] = await getFileUrl(FILES[i]);
      }
    } catch (e) {
      console.error(e);
      writeState({ loading: false, crashes: 0 });
      loadingText.style.display = "none";
      showPanel("error",
        "<b>Download failed.</b><br>" + String(e && e.message || e) +
        "<br><br><button id='retry'>Try again</button>");
      document.getElementById("retry").onclick = start;
      return;
    }

    console.log("[start] files ready, launching Unity");
    loadingText.textContent = "STARTING GAME...";
    loadingBar.style.display = "block";

    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: urls["20minutes.data"],
      frameworkUrl: buildUrl + "/20minutes.framework.js",
      codeUrl: urls["20minutes.wasm"],
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Flanne",
      productName: "MinutesTillDawn",
      productVersion: "0.6.6",
      showBanner: unityShowBanner
    };

    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                   (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS "desktop" mode
    if (isMobile) {
      // Render at 1x instead of 2x/3x: a Retina backbuffer wastes GPU memory,
      // and this build is already tight on it (see the context-lost handling below).
      config.devicePixelRatio = 1;
      console.log("[start] mobile device: devicePixelRatio capped at 1");
    }

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.head.appendChild(meta);
    }

    var script = document.createElement("script");
    script.src = buildUrl + "/20minutes.loader.js";
    script.onerror = function () {
      console.error("[start] could not load loader script");
      writeState({ loading: false, crashes: 0 });
      showPanel("error", "<b>Could not load the Unity loader script.</b><br>Check your connection and reload.");
    };
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBar.style.width = (100 * progress) + "%";
      }).then(function (instance) {
        unityInstance = instance;
        console.log("[start] Unity started OK");
        loadingBar.style.display = "none";
        loadingText.remove();
        // Only call the load "good" after the game survives 20 s. On iOS the GPU
        // often dies a second or two AFTER startup, and that must still count as a crash.
        stableTimer = setTimeout(function () {
          writeState({ loading: false, crashes: 0 });
          console.log("[start] stable for 20 s, crash counter reset");
        }, 20000);
        fsButton.style.display = "block";
        // Unity has copied the files into its own memory; free our blob copies.
        for (var k in urls) { try { URL.revokeObjectURL(urls[k]); } catch (e) {} }
      }).catch(function (message) {
        console.error("[start] createUnityInstance failed: " + message);
        writeState({ loading: false, crashes: 0 });
        loadingText.style.display = "none";
        showPanel("error", "<b>The game failed to start.</b><br>" + String(message) +
          "<br><br><button id='retry'>Try again</button>");
        document.getElementById("retry").onclick = function () { location.reload(); };
      });
    };
    document.body.appendChild(script);
  }

  /* ---------------- Fullscreen: only when the user clicks ---------------- */
  fsButton.addEventListener("click", function () {
    if (unityInstance) unityInstance.SetFullscreen(1);
  });

  /* A normal reload/close fires pagehide. A tab crash does not, so a leftover
     "loading: true" flag on startup means the previous attempt crashed. */
  window.addEventListener("pagehide", function () {
    var s = readState();
    if (s.loading) writeState({ loading: false, crashes: s.crashes || 0 });
  });

  /* ---------------- GPU context loss ---------------- */
  canvas.addEventListener("webglcontextlost", function () {
    clearTimeout(stableTimer);
    var s = readState();
    writeState({ loading: false, crashes: (s.crashes || 0) + 1 });
    console.error("[webgl] context lost " + ((performance.now() / 1000).toFixed(1)) + "s after page load");
    showPanel("error",
      "<b>The graphics context was lost (the device ran out of GPU memory).</b><br>" +
      "This build ships PC-style (DXT) textures. iPhones and iPads cannot use them, so every texture " +
      "is expanded to full size, which uses about 4x the GPU memory." +
      "<ul>" +
      "<li>Fully close other apps and browser tabs, then reload</li>" +
      "<li>Restart the device to free memory</li>" +
      "<li>For the best chance, play on a desktop or laptop</li>" +
      "</ul>" +
      "<button id='ctxreload'>Reload</button>");
    document.getElementById("ctxreload").onclick = function () { location.reload(); };
  });

  /* ---------------- Hooks for the debug terminal ---------------- */
  window.__game = {
    getLoaded: function () { return loadedBytes; },
    getInstance: function () { return unityInstance; },
    readState: readState,
    writeState: writeState
  };

  /* ---------------- Crash-loop guard ---------------- */
  var prev = readState();
  var crashes = prev.loading ? (prev.crashes || 0) + 1 : (prev.crashes || 0);

  if (prev.loading) writeState({ loading: false, crashes: crashes });

  if (crashes >= MAX_CRASHES) {
    console.warn("[guard] " + crashes + " crashed loads in a row - waiting for the user");
    loadingText.style.display = "none";
    if (window.dbg) { window.dbg.open(); window.dbg.run("prev 30"); }
    showPanel("warn",
      "<b>This tab crashed " + crashes + " times while loading.</b><br>" +
      "It most likely ran out of memory. Before trying again:" +
      "<ul>" +
      "<li>Close other tabs and heavy apps</li>" +
      "<li>Restart your browser</li>" +
      "<li>Try a different browser (Firefox or Edge)</li>" +
      "<li>Press F2 for the debug terminal and type <b>prev</b> to see the log from the crashed attempt</li>" +
      "</ul>" +
      "<button id='go'>Try loading anyway</button>" +
      "<button id='clr' class='secondary'>Clear cached game files</button>");
    document.getElementById("go").onclick = function () {
      writeState({ loading: false, crashes: 0 });
      start();
    };
    document.getElementById("clr").onclick = async function () {
      await clearCaches();
      this.textContent = "Cache cleared";
    };
  } else {
    start();
  }
})();
    </script>
  </body>
</html>
